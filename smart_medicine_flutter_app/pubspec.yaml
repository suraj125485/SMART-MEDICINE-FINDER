name: smart_medicine_availability_app
description: "A production-ready Flutter app to find medicine availability across nearby pharmacies in real time."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Typography & Icons
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.2

  # Official Firebase SDKs
  firebase_core: ^3.10.0
  firebase_auth: ^5.4.0
  cloud_firestore: ^5.6.1

  # Animations
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
